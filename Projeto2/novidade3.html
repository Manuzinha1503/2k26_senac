<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjunto Premium | EIMI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topo">
            <a class="henny-penny-regular" href="./index.html">EIMI</a>
            <a href="./carrinho.html" class="link-carrinho"><img src="imagens/carrinho.png" alt="Carrinho de compras" class="logo-carrinho"></a>
        </div>
    </header>

    <main class="pagina-peca">
        <a class="voltar-link" href="./novidade.html">Voltar para novidades</a>
        <section class="detalhe-peca">
            <img src="imagens/novidade.ace.png" alt="Conjunto Premium">
            <div class="detalhe-info">
                <h1>Conjunto Premium</h1>
                <p>Peças selecionadas com acabamento refinado para um visual diferenciado.</p>
                <div class="preco">R$ 329,90</div>
                <p>Um conjunto sofisticado, pensado para ocasiões especiais e para quem valoriza qualidade em cada detalhe.</p>
                <div class="botoes-peca">
                    <button class="botao-peca" onclick="adicionarProdutoCarrinho()">Adicionar no carrinho</button>
                </div>
                <script>
                    function adicionarProdutoCarrinho() {
                        const nome = document.querySelector('.detalhe-info h1').textContent;
                        const precoText = document.querySelector('.preco').textContent;
                        const preco = parseFloat(precoText.replace('R$ ', '').replace(',', '.'));
                        const imagem = document.querySelector('.detalhe-peca img').src;
                        const id = window.location.pathname.split('/').pop().replace('.html', '');
                        adicionarAoCarrinho({ id, nome, preco, imagem });
                    }
                </script>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2023 EIMI. Todos os direitos reservados.</p>
    </footer>
    <script src="Java/carrinho.js"></script>
</body>
</html>
